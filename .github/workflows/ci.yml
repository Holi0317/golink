# CI for golink (golink-djs).
#
# Lint/test run on every push to main and every PR. Images are built with ko
# (ko.yaml) and pushed to GHCR only on main pushes. All tools — including Go —
# come from mise (mise.toml/mise.lock), so CI matches local dev exactly.
#
# Every action is pinned to the commit SHA of its latest release (golink-dt9);
# the release tag is noted in a comment. Bump by re-resolving the tag's SHA:
#   gh api repos/<owner>/<repo>/commits/<tag> --jq .sha
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # mise.toml [env] exports DATABASE_URL through mise-action, so
    # database-backed tests always attempt to connect. pgtestdb needs
    # server coords only (it clones per-test template databases under the
    # pgtdbuser role); localhost:5432 with trust auth matches DATABASE_URL.
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # jdx/mise-action v5.1.1; mise's own install cache is on by default.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca

      # Go dependency (module) cache, keyed on go.sum (actions/cache v6.1.0).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/go/pkg/mod
          key: go-deps-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-deps-${{ runner.os }}-

      # Go compile cache + golangci-lint cache, keyed on deps + tool set.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-build-${{ runner.os }}-${{ hashFiles('go.sum', 'mise.toml') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ hashFiles('go.sum', 'mise.toml') }}-
            go-build-${{ runner.os }}-

      - run: go test ./...

      # hk check covers golangci-lint, actionlint, and codegen freshness
      # (templ/sqlc regenerate + fail on diff) — the same steps as the local
      # pre-commit hook, so CI and commits never drift (hk.pkl).
      - run: hk run check --all

  image:
    name: Build & push image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # docker/login-action v4.6.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ko-build/setup-ko v0.10
      - uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445

      - name: ko build
        run: |
          # Registries accept lowercase paths only; github.repository keeps
          # the owner's original casing (Holi0317 -> holi0317). --bare
          # publishes KO_DOCKER_REPO as-is (GHCR only allows root-level
          # images; the default namer would append an import-path hash).
          KO_DOCKER_REPO="ghcr.io/$(tr '[:upper:]' '[:lower:]' <<< '${{ github.repository }}')"
          export KO_DOCKER_REPO
          ko build --bare --platform=linux/amd64,linux/arm64 --tags=latest,sha-${{ github.sha }}
