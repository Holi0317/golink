# CI for golink (golink-djs).
#
# Lint/test run on every push to main and every PR. Images are built with ko
# (ko.yaml) and pushed to GHCR only on main pushes. All tools — including Go —
# come from mise (mise.toml/mise.lock), so CI matches local dev exactly.
#
# Every action is pinned to the commit SHA of its latest release (golink-dt9);
# the release tag is noted in a comment. Bump by re-resolving the tag's SHA:
#   gh api repos/<owner>/<repo>/commits/<tag> --jq .sha
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # jdx/mise-action v5.1.1; mise's own install cache is on by default.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca

      # Go dependency (module) cache, keyed on go.sum (actions/cache v6.1.0).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/go/pkg/mod
          key: go-deps-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-deps-${{ runner.os }}-

      # Go compile cache + golangci-lint cache, keyed on deps + tool set.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-build-${{ runner.os }}-${{ hashFiles('go.sum', 'mise.toml') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ hashFiles('go.sum', 'mise.toml') }}-
            go-build-${{ runner.os }}-

      - run: go test ./...

      - run: golangci-lint run

      - name: Generated code is fresh (templ, sqlc)
        run: |
          templ generate
          sqlc generate
          git diff --exit-code -- www db

  image:
    name: Build & push image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # docker/login-action v4.6.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ko-build/setup-ko v0.10
      - uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445

      - name: ko build
        env:
          KO_DOCKER_REPO: ghcr.io/${{ github.repository }}
        run: ko build --platform=linux/amd64,linux/arm64 --tags=latest,sha-${{ github.sha }}
