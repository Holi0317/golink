[tools]
# hk's actionlint builtin needs the binary; declaring it here keeps CI
# (mise-action) and local dev on the same tool set.
actionlint = "latest"
"github:a-h/templ" = "latest"
"github:gastownhall/beads" = "latest"
go = "1.27"
golangci-lint = "2.14.0"
ko = "latest"
hk = "latest"
pitchfork = "latest"
postgres = "latest"
sqlc = "latest"

[env]
GOTOOLCHAIN = "local"
# Local dev database for dbmate/sqlc/pitchfork postgres (trust auth, loopback
# only). See pitchfork.toml [daemons.postgres].
DATABASE_URL = "postgres://postgres@localhost:5432/golink?sslmode=disable"

[tasks.build]
description = "Build the golink binary into ./build/"
run = "go build -o ./build/golink ."

[tasks.test]
run = "go test ./..."

[tasks.lint]
description = "Lint the Go module with golangci-lint"
run = "golangci-lint run"

[tasks.dev]
description = "Start the golink dev server (pitchfork daemon with reload on code change); follow logs with pitchfork logs golink -f"
run = "pitchfork start golink"

[tasks.dev-stop]
description = "Stop all local pitchfork daemons (postgres, codegen, dev server)"
run = "pitchfork stop --local"

# Create the dev postgres database if missing. `golink migrate up` refuses
# to create databases (fail-fast prod semantics), so dev bootstraps here.
[tasks."db:create"]
description = "Create the dev golink database if it does not exist"
run = """
psql -h localhost -U postgres -d postgres -tAc "select 1 from pg_database where datname = 'golink'" | grep -q 1 || createdb -h localhost -U postgres golink
"""

# Same codepath as prod: migrations ship embedded in the binary and apply
# through cmd/migrate.go. No standalone dbmate in this repository.
[tasks."migrate:up"]
description = "Apply pending migrations to the dev postgres (pitchfork); idempotent"
depends = ["db:create"]
run = "go run . migrate up"

[tasks."db:status"]
description = "Show migration status against the dev postgres; exits 1 when pending"
run = "go run . migrate status"

[tasks."gen:templ"]
description = "Regenerate Go components (www/*_templ.go) from www/*.templ via templ"
# Generated *_templ.go files are committed: `go build` needs them, and
# committing keeps builds and CI free of a codegen step.
run = "templ generate"

[tasks."gen:sqlc"]
description = "Regenerate Go DB code (db/generated) from db/queries + db/migrations via sqlc"
run = "sqlc generate"
